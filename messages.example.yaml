# Здесь ты задаёшь, что именно пишет Gemini. Скопируй в messages.yaml и перепиши под себя.
#
# mode:
#   template - никакого ИИ, просто подставляются плейсхолдеры. Быстро и бесплатно,
#              но все сообщения одинаковые.
#   hybrid   - Gemini берёт твой шаблон ниже и адаптирует под конкретный бизнес.
#              Рекомендую: текст остаётся твой, но перестаёт выглядеть рассылкой.
#   ai       - Gemini пишет с нуля по задаче, стилю и примерам.
mode: hybrid

language: "украинский"

# Факты о тебе. Модели запрещено выдумывать что-то сверх этого списка.
sender:
  name: "Катерина"
  studio: "приватний веброзробник"
  offer: "простий сайт-візитівка з записом онлайн"
  term: "3-5 днів"
  price_from: "від 6000 грн"
  portfolio: "https://example.com/portfolio"
  contact: "@my_telegram"

style:
  tone: "спокійно, по-людськи, як пишуть у месенджері знайомому. Без офіціозу і без продажного тиску"
  max_chars: 420
  no_emoji: true
  no_dashes: true
  forbid:
    - "унікальна пропозиція"
    - "не упустіть"
    - "лише сьогодні"
    - "індивідуальний підхід"
    - "команда професіоналів"
    - "збільшить ваші продажі вдвічі"
  extra: "Звертайся на ви. Не починай обидва повідомлення однаково."

message_1:
  goal: |
    Перший контакт. Коротко: звідки ти про них дізнався, що помітив
    (їх немає в пошуку, бо немає сайту), і одне конкретне питання,
    на яке легко відповісти одним словом. Не продавай у лоб.
  template: |
    Вітаю! Шукала {niche} у місті {city} і натрапила на {name}.
    Помітила, що у вас немає сайту, тільки карта і телефон. Через це вас
    важко знайти тим, хто гуглить, і немає куди подивитися ціни та записатися.

    Я роблю {offer}, {term}, {price_from}. Приклади робіт: {portfolio}

    Чи цікаво подивитися, як це могло б виглядати для вас?
  examples:
    - "Вітаю! Шукала майстра і побачила вашу студію на карті, але сайту немає. Це навмисно чи просто руки не дійшли?"

message_2:
  goal: |
    Ввічливе нагадування через кілька днів, якщо на перше не відповіли.
    Коротше за перше. Додай один новий аргумент або конкретику, якої не було,
    і явно дай можливість відмовитися без незручності.
  template: |
    Вітаю ще раз! Нагадую про себе щодо сайту для {name}.

    Якщо зараз не на часі, просто скажіть, і я більше не турбуватиму.
    А якщо цікаво, можу за пів години показати чернетку головної сторінки,
    безкоштовно і без зобовʼязань.
  examples:
    - "Доброго дня! Розумію, що могло бути не до того. Якщо тема сайту не актуальна, скажіть, і я не писатиму більше."

# Сюда можно дописать что угодно, текст уйдёт в системную инструкцию как есть.
extra_instructions: |
  Якщо в даних видно, що бізнес має Instagram, у першому повідомленні можна
  згадати, що сайт доповнить профіль, а не замінить його.
